# ─────────────────────────────────────────────────────────────────────────────
# Schedule Event V2 — VPS stack (Opsi B: lepas Supabase → Postgres mandiri)
#
# Topologi:
#   nginx (static SPA dist/ + proxy /api/v1) ──> api (node:20-alpine,
#        server/src/index.js, port 3001 internal) ──> postgres 16 (volume pgdata)
#
# Media TETAP di Cloudflare R2 — tidak ada volume media di VPS:
#   api  = presign upload/download via S3 SDK (R2_*)
#   nginx = tidak menyimpan/menyajikan media user
#
# Prasyarat:
#   - Repo root (context "..") berisi dist/ hasil build frontend + server/ backend.
#   - cp .env.example .env  → isi, lalu:  docker compose up -d
#   Cara pakai detail: baca README-DEPLOY.md di direktori ini.
# ─────────────────────────────────────────────────────────────────────────────

name: metmal

services:
  postgres:
    image: postgres:16-alpine
    container_name: metmal-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-metmal}
      POSTGRES_USER: ${POSTGRES_USER:-metmal}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-metmal} -d ${POSTGRES_DB:-metmal}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # TANPA mapping port host: vm-2-245-ubuntu sudah punya Postgres native
    # LISTEN di 127.0.0.1:5432 → bind host gagal bila dipetakan. Tooling
    # seed/psql via `docker compose exec postgres psql` (lihat README §6).
    networks:
      - metmal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    # Backend REST /api/v1 — server/src/index.js (Node 20, ESM, port PORT|3001).
    # Repo di-bind-mount (read-only) + node_modules di named volume hasil
    # `npm ci --omit=dev` otomatis saat boot pertama — tanpa Dockerfile.
    # (Bila nanti ada Dockerfile khusus, ganti image+volumes dengan build:. )
    image: node:20-alpine
    container_name: metmal-api
    restart: unless-stopped
    working_dir: /srv/app
    command: >
      sh -c 'if [ ! -d node_modules/pg ]; then
        npm ci --omit=dev --no-audit --no-fund;
      fi &&
      exec node server/src/index.js'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3001"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL di .env}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      # Opsional — hanya jika cookie lintas-subdomain (mis. api.domain.com):
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      # Opsional — 'none' utk frontend cross-site (SPA Vercel → api domain lain).
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      # Opsional — daftar origin (koma) bila bukan "*" (default server).
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      # Presign media — R2 Cloudflare, bukan storage VPS.
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:?isi R2_ACCOUNT_ID di .env}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:?isi R2_ACCESS_KEY_ID di .env}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:?isi R2_SECRET_ACCESS_KEY di .env}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:?isi R2_BUCKET_NAME di .env}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}
    volumes:
      # Repo root (server/ + file JS bersama yang di-import, mis. api/_lib) — ro.
      - ../../:/srv/app:ro
      # node_modules terpisah agar instalasi container bersih Linux/alpine.
      - node_modules:/srv/app/node_modules
    expose:
      - "3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/v1/events').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - metmal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  nginx:
    image: nginx:1.27-alpine
    container_name: metmal-nginx
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Konfigurasi: static SPA + proxy /api/v1 → api:3001 + OG /events/:id.
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Build frontend di host dulu (README §4): npm ci && npm run build → dist/
      - ../../dist:/usr/share/nginx/html:ro
      # TLS certbot (README §8): aktifkan setelah sertifikat dibuat.
      # - ./certbot/conf:/etc/letsencrypt:ro
      # - ./certbot/www:/var/www/certbot:ro
    networks:
      - metmal
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  node_modules:

networks:
  metmal:
    driver: bridge
