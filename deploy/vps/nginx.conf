# ─────────────────────────────────────────────────────────────────────────────
# Schedule Event V2 — nginx (VPS). Dipasang read-only di nginx container
# sebagai /etc/nginx/conf.d/default.conf (lihat docker-compose.yml).
#
# Tanggung jawab:
#   1. Serve static SPA (dist/ → /usr/share/nginx/html) + fallback index.html
#   2. Proxy /api/v1/* → api:3001 (backend REST, cookie auth tetap asli)
#   3. OG/Twitter meta untuk /events/:id → upstream api (analog event-og.js);
#      bila upstream belum punya route / belum hidup → fallback shell SPA polos
#   4. Cache header setara vercel.json + gzip; rate-limit login di backend
#      (pengganti rateLimit edge di API lama)
#
# Media TIDAK lewat nginx/VPS — gambar user disajikan Cloudflare R2 langsung
# (R2_PUBLIC_URL), presign dilakukan api.
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limit login: TIDAK di nginx — ditangani penuh backend (routes/auth.js,
# 20/15mnt per IP, respons 429 JSON Indonesia). limit_req nginx membalas
# 503 HTML English default yang menabrak kontrak UI error.

# Cache header HTML untuk halaman-halaman yang di-vercel.json diberi s-maxage.
# Berlaku untuk respons index.html; /events/:id (OG) diatur upstream-nya.
map $uri $html_cache {
    default                                  "no-cache";
    /                                        "public, s-maxage=60, stale-while-revalidate=120";
    /events                                  "public, s-maxage=60, stale-while-revalidate=120";
    /gallery                                 "public, s-maxage=120, stale-while-revalidate=240";
}

# ── HTTP (port 80): SPA + API + ACME. Aktifkan TLS via certbot → README §8 ──
server {
    # Body limit: letters bawa pdfBase64 (zod ≤2,5MB chars + envelope JSON) →
    # express.json 5mb; default nginx 1MB akan 413. Naikkan supaya selaras.
    client_max_body_size 10m;
    listen 80;
    # Ganti dengan domain produksi bila perlu (tanpa server_name tetap jalan):
    # server_name metmal.example.com;

    root /usr/share/nginx/html;
    index index.html;

    # ── gzip ──────────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        application/rss+xml
        image/svg+xml
        font/woff2
        application/octet-stream;

    # ── ACME challenge (certbot). Selalu tersedia walau sebelum cert ada. ─
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    # ── Cache statis: /assets/* immutable 1 tahun (hash Vite di nama file) ─
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # ── SPA shell ─────────────────────────────────────────────────────────
    # Halaman yang bukan file nyata → index.html (client-side routing).
    # Security headers + Cache-Control setara vercel.json (header source "/").
    location / {
        add_header Cache-Control $html_cache always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        try_files $uri $uri/ /index.html;
    }

    # ── OG meta /events/:id (analog vercel.json rewrite → event-og.js) ────
    # GET /events/<id> → api:3001/api/v1/event-og?id=<id>. Upstream inject
    # og/twitter/JSON-LD ke <head>; untuk browser hasilnya tetap shell SPA
    # yang valid (sama seperti perilaku event-og.js).
    # Fail-open: 5xx (api mati) → 200 index.html polos, agar halaman valid
    # tidak hilang dari indeks crawler (pola event-og.js). 404 juga diubah ke
    # shell SPA karena route event-og di backend belum ada (sementara); bila
    # route sudah dibuat dan ingin noindex penuh utk event draft/missing,
    # hapus 404 dari baris error_page.
    location ~ ^/events/([^/]+)/?$ {
        proxy_pass http://api:3001/api/v1/event-og?id=$1;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Original-URI $request_uri;
        proxy_intercept_errors on;
        error_page 404 502 503 504 =200 /index.html;
    }

    # ── REST API ──────────────────────────────────────────────────────────
    # Semua /api/v1/* → backend (auth cookie diteruskan apa adanya).
    location /api/v1/ {
        proxy_pass http://api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        # Tidak ada buffering khusus — streaming/respons JSON polos.
    }

    # Login rate-limit: ditangani backend (lihat komentar atas) — /api/v1/
    # location umum sudah mencakup /api/v1/auth/login.
}

# ══ TLS (certbot) — AKTIFKAN setelah sertifikat jadi: ═══════════════════════
# Langkah (detail: README-DEPLOY.md §8):
#   1)  docker compose run --rm certbot certonly --webroot -w /var/www/certbot \
#         -d DOMAIN --email ADMIN@DOMAIN --agree-tos --no-eff-email
#   2)  Buka komentar bind-mount certbot di docker-compose.yml (baris
#       ./certbot/conf → /etc/letsencrypt, ./certbot/www → /var/www/certbot).
#   3)  Salin blok server 443 berikut (tambahkan dua baris listen ke blok 80
#       dan pindahkan root/proxy di atas ke blok 443):
#
# server {
#     listen 443 ssl;
#     http2 on;
#     server_name DOMAIN;
#
#     ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
#     ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;
#     ssl_protocols TLSv1.2 TLSv1.3;
#     ssl_session_cache shared:SSL:10m;
#     ssl_session_timeout 1d;
#
#     # ...salin semua location dari blok 80 di atas ke sini...
# }
#
#   4)  Blok 80: tambahkan baris berikut agar http → https (acme-challenge
#       tetap tersaji di blok 80 sebelum redirect):
#       if ($request_uri !~ ^/\.well-known/acme-challenge/) {
#           return 301 https://$host$request_uri;
#       }
#   5)  docker compose restart nginx
#   6)  Perpanjang otomatis (cron harian di host):
#       docker run --rm -v "$(pwd)/certbot/conf:/etc/letsencrypt" \
#         -v "$(pwd)/certbot/www:/var/www/certbot" certbot/certbot renew
