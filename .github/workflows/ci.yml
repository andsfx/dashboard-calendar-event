# ============================================================================
# CI — gerbang otomatis (build + typecheck + unit test)
# ----------------------------------------------------------------------------
# Sebelum ini repo TIDAK punya CI sama sekali (`.github/` tidak ada, tidak ada
# husky). Klaim "726 test hijau" karenanya hanya berlaku di satu mesin
# pengembang — regresi apa pun bisa masuk main tanpa terdeteksi.
#
# Job ini menjalankan tiga gerbang yang sama dengan verifikasi manual:
#   1. `npx tsc --noEmit`        — tipe SPA (server/ adalah JS, tidak dicek tsc)
#   2. `npx vitest run --maxWorkers=2`
#                                — unit test (jsdom + beberapa file env `node`)
#   3. `npm run build`           — tsc + vite build produksi
#
# `--maxWorkers=2` dipertahankan sebagai mode verifikasi repo ini: worker
# paralel penuh (default = jumlah CPU runner) membuat tes berbasis
# timer/debounce saling berebut CPU, dan AGENTS.md mencatat kontensi itu
# (`Test timed out in 5000ms`, kegagalan berpindah antar-berkas) sebagai sumber
# kegagalan suite di mesin dev. Namun BUKAN ini penyebab merahnya unit test di
# CI 2026-10-31.
#
# Akar flake tenant picker (3 run CI merah identik, hanya tes pertama di
# `TenantCollaborationPage.test.tsx`): `RevealSection` memindahkan subtree-nya
# saat tween GSAP mulai (`remove` + `insert` node `.reveal-stage`). Pemindahan
# itu mencabut fokus elemen yang sedang diketik tanpa memicu `blur`, sehingga
# `userEvent.type` kehilangan sisa ketikan dan opsi tenant tidak pernah dimuat
# (menaikkan timeout 1 s → 4 s tidak menolong). Diperbaiki dengan memindahkan
# form ke luar subtree animasi di `src/pages/TenantCollaborationPage.tsx`
# (hanya judul yang dianimasikan) + tes regresi yang menegaskan form interaktif
# tidak berada di dalam `.reveal-stage`.
#
# Catatan: `NODE_ENV=test` WAJIB untuk vitest. Tanpa itu, React memakai build
# produksi dan tes yang menyentuh `act()` gagal dengan pesan menyesatkan.
# ============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Batalkan run lama untuk ref yang sama — hemat menit CI.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install (clean)
        run: npm ci

      - name: Typecheck (SPA)
        run: npx tsc --noEmit

      # `--maxWorkers=2`: mode verifikasi repo ini (mengurangi kontensi worker
      # antar-tes berbasis timer/debounce). Bukan penyebab flake tenant picker di
      # CI — akar sebenarnya subtree reveal memindahkan node interaktif, diperbaiki
      # di `src/pages/TenantCollaborationPage.tsx`.
      - name: Unit tests
        run: npx vitest run --reporter=dot --maxWorkers=2
        env:
          NODE_ENV: test

      # Build produksi TIDAK memakai NODE_ENV=test: itu akan membuat Vite
      # meng-*inline* build React pengembangan ke bundle. `npm run build`
      # sendiri sudah menjalankan `tsc && vite build` + assert-lazy-entry-chunks.
      - name: Build produksi
        run: npm run build
